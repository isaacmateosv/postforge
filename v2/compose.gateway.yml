# Add to the base Compose file. No gateway or identity-service ports are published.
services:
  postforge-gateway:
    image: caddy:2-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
    restart: unless-stopped
    environment:
      POSTFORGE_GATEWAY_HOST: ${POSTFORGE_GATEWAY_HOST:-${NGROK_DOMAIN}}
    volumes:
      - ./run/postforge-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      - postforge-auth
      - postforge-media-auth

  postforge-media-auth:
    image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    restart: unless-stopped
    command: ["python", "-B", "/app/media_links.py", "serve", "/media.key"]
    read_only: true
    mem_limit: 64m
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./scripts/lib/media_links.py:/app/media_links.py:ro
      - type: bind
        source: ./data/gateway/media-signing.key
        target: /media.key
        read_only: true
        bind:
          create_host_path: false

  postforge-auth:
    image: authelia/authelia:4.39@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: unless-stopped
    environment:
      TZ: UTC
    volumes:
      - type: bind
        source: ./data/gateway
        target: /config
        bind:
          create_host_path: false
    security_opt: [no-new-privileges:true]
    mem_limit: 384m

  ngrok: {"image": "cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba", "entrypoint": ["cloudflared"], "command": ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", "http://postforge-gateway:8080", "--metrics", "0.0.0.0:2000"], "environment": {"NGROK_AUTHTOKEN": "", "TUNNEL_TOKEN": ""}, "depends_on": ["postforge-gateway"], "restart": "unless-stopped", "mem_limit": "192m", "pids_limit": 64, "cap_drop": ["ALL"], "security_opt": ["no-new-privileges:true"], "read_only": true, "deploy": {"resources": {"limits": {"memory": "192m", "cpus": "0.5", "pids": 64}}}}
