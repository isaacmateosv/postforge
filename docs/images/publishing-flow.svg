<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc"><title id="title">PostForge: from idea to approved publishing</title><desc id="desc">Media or a text announcement enters through the desktop app, WhatsApp or Telegram. Keep exact words or generate copy, then review the plan. Approve drafts in Postiz or confirm direct scheduling. WhatsApp Status requires separate approval. Temporal publishes to connected accounts. The tray monitors health and connections.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172b48"/><stop offset="1" stop-color="#0b1424"/></linearGradient></defs><rect width="1200" height="410" rx="28" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><text x="40" y="54" fill="#fff" font-size="27" font-weight="700">Your idea. Your approval. Reliable scheduling.</text><text x="40" y="84" fill="#a5bbd8" font-size="16">PostForge keeps the preparation local and the publishing decision with you.</text><rect x="40" y="120" width="250" height="175" rx="18" fill="#1b304d" stroke="#385578"/><text x="60" y="155" fill="#78c7f0" font-size="15">01</text><text x="60" y="190" fill="#fff" font-size="17" font-weight="700">BRING YOUR IDEA</text><text x="60" y="225" fill="#d9e4f4" font-size="15">Media or text announcement</text><text x="60" y="253" fill="#a5bbd8" font-size="14">Desktop · WhatsApp · Telegram</text><text x="302" y="213" fill="#78c7f0" font-size="25">→</text><rect x="330" y="120" width="250" height="175" rx="18" fill="#1b304d" stroke="#385578"/><text x="350" y="155" fill="#78c7f0" font-size="15">02</text><text x="350" y="190" fill="#fff" font-size="17" font-weight="700">PREPARE LOCALLY</text><text x="350" y="225" fill="#d9e4f4" font-size="15">Keep or generate your caption</text><text x="350" y="253" fill="#a5bbd8" font-size="14">Bake and review the plan</text><text x="592" y="213" fill="#78c7f0" font-size="25">→</text><rect x="620" y="120" width="250" height="175" rx="18" fill="#1b304d" stroke="#385578"/><text x="640" y="155" fill="#78c7f0" font-size="15">03</text><text x="640" y="190" fill="#fff" font-size="17" font-weight="700">YOU APPROVE</text><text x="640" y="225" fill="#d9e4f4" font-size="15">Drafts or direct scheduling</text><text x="640" y="253" fill="#a5bbd8" font-size="14">WhatsApp approved separately</text><text x="882" y="213" fill="#78c7f0" font-size="25">→</text><rect x="910" y="120" width="250" height="175" rx="18" fill="#1b304d" stroke="#385578"/><text x="930" y="155" fill="#78c7f0" font-size="15">04</text><text x="930" y="190" fill="#fff" font-size="17" font-weight="700">PUBLISH ON TIME</text><text x="930" y="225" fill="#d9e4f4" font-size="15">Temporal runs the schedule</text><text x="930" y="253" fill="#a5bbd8" font-size="14">Connected social accounts</text><rect x="40" y="320" width="1120" height="53" rx="14" fill="#213d51"/><text x="64" y="353" fill="#b7e9d7" font-size="16">MENU BAR · Service health · Reconnection countdown · Updates · Configurable 30-day history</text></g></svg>