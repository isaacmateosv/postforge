name: Validate and package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes a run in progress (tag runs are never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  recheck:
    name: Recheck and build the app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Static recheck (syntax, compose, secrets, version)
        run: ./scripts/recheck.sh
      - name: Operations regression checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_operations.py
      - name: Build the app (universal, portable)
        run: ./tray/build.sh --portable
      - name: Verify icon artwork, sizes, version, architectures and signature
        run: ./scripts/verify-artifacts.sh

  v2-smoke:
    name: Validate the v2 browser and gateway configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test gateway migration and Telegram
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s v2 -p 'test_*.py'
      - name: Validate Compose and start the local dashboard
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f v2/compose.gateway.yml config --quiet
          docker compose -f docker-compose.yml -f v2/compose.yml --profile web --profile telegram config --quiet
          docker compose -f docker-compose.yml -f v2/compose.yml --profile web up -d --build --no-deps postforge-web
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 --retry-max-time 45 --max-time 5 -o /tmp/postforge-dashboard.html http://127.0.0.1:8787/
          grep -q PostForge /tmp/postforge-dashboard.html

  package:
    if: startsWith(github.ref, 'refs/tags/v1.')
    name: Build the installer package
    needs: [recheck, v2-smoke]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: A release tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          fi
      - name: Build the sanitized package
        run: ./scripts/package.sh
      - name: Verify the actual installer payload
        run: ./scripts/verify-artifacts.sh tray/build/PostForge.app "dist/PostForge-$(cat VERSION).pkg"
      - name: Upload package and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: postforge-package   # artifact names are per run and cannot contain "/" (branch names can)
          path: |
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v1.')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: postforge-package
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac   # 1.2.0-pre.1 is a pre-release, never "latest"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "PostForge $GITHUB_REF_NAME" --notes-file release-notes.md $flags
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "PostForge $GITHUB_REF_NAME" --notes-file release-notes.md $flags
          fi
