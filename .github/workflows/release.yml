name: Publish desktop release
# Build the three desktop clients for a version tag and attach them to a GitHub
# Release. rc/alpha/beta tags publish as pre-releases, so test machines update on
# the test channel while stable machines only ever see finished releases. The
# build job stays read-only; only the publish job may write release contents.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v2.0.0-rc.23)
        required: true
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
  REF: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm the tag matches the project version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${REF#v}" != "$version" ]; then
            echo "Tag $REF does not match VERSION $version"; exit 1
          fi
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      - name: Timezone database for Python on Windows
        run: python -m pip install tzdata
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dialog accessibility and confirmation regression tests
        run: node --test desktop/test/dialogs.test.cjs desktop/test/signed-media.test.cjs desktop/test/network-links.test.cjs desktop/test/completion-timer.test.cjs desktop/test/media-feedback.test.cjs desktop/test/whatsapp-buttons.test.cjs
      - name: Compile native client
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - name: Package native artifact and notices
        run: python desktop/package.py --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: desktop/dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Classify the release channel
        id: channel
        shell: bash
        run: |
          if printf '%s' "$REF" | grep -Eq -- '-(rc|alpha|beta)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release and attach every OS build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REF }}
          name: PostForge Desktop ${{ env.REF }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
