name: Rust desktop client
on:
  workflow_dispatch:
  push:
    branches: [main, "codex/v2-*"]
    paths: ["desktop/**", "scripts/lib/**", "scripts/desktop_bridge.py", "v2/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "scripts/lib/**", "scripts/desktop_bridge.py", "v2/**", ".github/workflows/desktop.yml"]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      - name: Timezone database for Python on Windows
        run: python -m pip install tzdata
      - name: Planner replay and media safety tests
        run: python -m unittest discover -s scripts -p test_composer.py
      - name: Dashboard, pairing and YouTube variant tests
        run: python -m unittest discover -s scripts -p test_desktop_status.py
      - name: Tunnel provider and rollback tests
        run: python -m unittest discover -s scripts -p test_network_settings.py
      - name: Audience and stopped-post repair regression tests
        run: python -m unittest discover -s scripts -p test_whatsapp_audience.py && python -m unittest discover -s scripts -p test_repair_media_links.py
      - name: WhatsApp interactive action safety
        run: python -m unittest discover -s scripts -p test_wa_interactive.py
      - name: Telegram settings and migration tests
        run: python -m unittest discover -s scripts -p test_telegram_settings.py
      - name: Telegram owner and callback tests
        run: python -m unittest discover -s v2 -p test_telegram_flow.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dialog accessibility and confirmation regression tests
        run: node --test desktop/test/dialogs.test.cjs desktop/test/signed-media.test.cjs desktop/test/network-links.test.cjs desktop/test/completion-timer.test.cjs desktop/test/media-feedback.test.cjs desktop/test/whatsapp-buttons.test.cjs desktop/test/backup-flow.test.cjs desktop/test/help-flow.test.cjs desktop/test/updates-flow.test.cjs
      - name: Runtime, requirements and updater regression tests
        run: python -m unittest discover -s scripts -p test_runtime_install.py && python -m unittest discover -s scripts -p test_requirements_check.py && python -m unittest discover -s scripts -p "test_desktop_update*.py"
      - name: Compile native client
        run: cargo build --release --locked --manifest-path desktop/Cargo.toml
      - name: Package native artifact and notices
        run: python desktop/package.py --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: PostForge-Desktop-${{ runner.os }}
          path: desktop/dist/*
